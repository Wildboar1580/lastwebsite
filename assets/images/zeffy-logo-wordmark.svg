<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">Last Christian Ministries logo</title>
  <desc id="desc">Transparent wordmark logo with a Luther rose style emblem and gold serif lettering for Last Christian Ministries.</desc>

  <defs>
    <linearGradient id="goldRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8dc94"/>
      <stop offset="38%" stop-color="#d5a629"/>
      <stop offset="70%" stop-color="#b78318"/>
      <stop offset="100%" stop-color="#f0cb66"/>
    </linearGradient>
    <linearGradient id="heartRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d63d43"/>
      <stop offset="100%" stop-color="#9e141b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g transform="translate(24 24)" filter="url(#softShadow)">
    <circle cx="156" cy="156" r="134" fill="none" stroke="url(#goldRing)" stroke-width="16"/>
    <circle cx="156" cy="156" r="119" fill="none" stroke="#fff6dc" stroke-opacity="0.28" stroke-width="2"/>

    <g fill="#fffdf7" stroke="#d7c291" stroke-width="4" stroke-linejoin="round">
      <path d="M156 85
        C174 105 183 120 187 134
        C208 118 227 111 251 109
        C243 131 236 149 221 169
        C242 174 260 182 275 194
        C255 205 239 211 220 215
        C232 237 239 256 244 278
        C221 270 202 260 185 248
        C180 262 171 280 156 298
        C141 280 132 262 127 248
        C110 260 91 270 68 278
        C73 256 80 237 92 215
        C73 211 57 205 37 194
        C52 182 70 174 91 169
        C76 149 69 131 61 109
        C85 111 104 118 125 134
        C129 120 138 105 156 85Z"/>
    </g>

    <path d="M156 116c18-24 49-29 69-10 19 18 19 46 0 64l-69 66-69-66c-19-18-19-46 0-64 20-19 51-14 69 10Z"
      fill="url(#heartRed)" stroke="#171311" stroke-width="6"/>
    <path d="M156 128v76" stroke="#111111" stroke-width="18" stroke-linecap="round"/>
    <path d="M118 166h76" stroke="#111111" stroke-width="18" stroke-linecap="round"/>
