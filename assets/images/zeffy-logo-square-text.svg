<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Last Christian Ministries square text logo</title>
  <desc id="desc">Square logo with dark background, gold border, and stacked Last Christian Ministries text for readability.</desc>

  <rect x="30" y="30" width="540" height="540" rx="34" fill="#111111"/>
  <rect x="30" y="30" width="540" height="540" rx="34" fill="none" stroke="#d5a629" stroke-opacity="0.52" stroke-width="4"/>

  <text x="300" y="228" text-anchor="middle" fill="#fbf7ef" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="0.2">
    Last
  </text>
  <text x="300" y="314" text-anchor="middle" fill="#d5a629" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="0.2">
    Christian
  </text>
  <text x="300" y="400" text-anchor="middle" fill="#fbf7ef" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="700" letter-spacing="0.2">
    Ministries
  </text>
</svg>
