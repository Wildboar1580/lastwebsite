<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 320" role="img" aria-labelledby="title desc">
  <title id="title">Last Christian Ministries wordmark</title>
  <desc id="desc">Minimal transparent wordmark logo for Last Christian Ministries with gold typography and a simple cross.</desc>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d98d"/>
      <stop offset="45%" stop-color="#d5a629"/>
      <stop offset="100%" stop-color="#b9851c"/>
    </linearGradient>
  </defs>

  <g transform="translate(70 58)">
    <circle cx="82" cy="102" r="66" fill="none" stroke="url(#gold)" stroke-width="8"/>
    <path d="M82 58v88" stroke="#111111" stroke-width="16" stroke-linecap="round"/>
    <path d="M52 94h60" stroke="#111111" stroke-width="16" stroke-linecap="round"/>
  </g>

  <g transform="translate(210 0)">
    <rect x="0" y="88" width="88" height="4" rx="2" fill="#d5a629"/>
    <text x="0" y="156" fill="#d5a629" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="0.2">
      Last Christian
    </text>
    <text x="0" y="242" fill="#d5a629" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="0.2">
      Ministries
    </text>
    <text x="3" y="286" fill="#5b4b33" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" letter-spacing="0.5">
      Confessional Lutheran ministry
    </text>
  </g>
</svg>
